# =============================================================================
# TanahKita — OpenSSH Server Drop-in Hardening Configuration
# Target Path on Server: /etc/ssh/sshd_config.d/00-hardening.conf
# Milestone Tag: sec-0.2 (Keamanan Komputasi dan Siber — Tugas 2)
# Mitigates: RSK-01 (THR-02 Insider/Admin Tampering), RSK-02 (THR-01 Spoofing)
# Verification:
#   sudo sshd -t
#   sudo sshd -T | grep -E 'passwordauthentication|permitrootlogin|kbdinteractiveauthentication|allowusers|maxauthtries'
# =============================================================================

# 1. Disable direct root login via SSH completely (force administrative actions through `sudo` for auditability)
PermitRootLogin no

# 2. Enforce Ed25519/RSA public-key authentication only; disable all password & interactive auth
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PermitEmptyPasswords no
UsePAM yes

# 3. Restrict SSH login strictly to the dedicated non-root administrative account
AllowUsers deploy

# 4. Brute-force & session hardening parameters
MaxAuthTries 3
MaxSessions 2
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# 5. Disable unnecessary tunneling & forwarding attack surfaces
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
PermitUserEnvironment no

# 6. Restrict key exchange, ciphers, and MACs to modern authenticated primitives
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
LogLevel VERBOSE
